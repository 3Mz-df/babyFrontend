<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tlias智能学习辅助系统</title>
    <style>
        /* 顶部导航栏样式 */
        .top-nav {
            background-color: #f0f0f0; /* 灰色背景 */
            padding: 15px 20px; /* 上下左右内边距 */
            display: flex; /* 使用flex布局 */
            justify-content: space-between; /* 两端对齐 */
            align-items: center; /* 垂直居中 */
        }

        /* 标题样式 */
        .top-nav h1 {
            margin: 0; /* 去除默认边距 */
            font-size: 24px; /* 加大字号 */
            font-weight: bold; /* 加粗 */
            color: #333; /* 文字颜色 */
        }

        /* 退出登录链接样式 */
        .top-nav a {
            text-decoration: none; /* 去除下划线 */
            color: #666; /* 文字颜色 */
            font-size: 16px;
            padding: 5px 10px;
        }

        /* 鼠标悬停效果 */
        .top-nav a:hover {
            color: #007bff;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <div class="top-nav">
        <h1>Tlias智能学习辅助系统</h1>
        <a href="#" target="_self">退出登录</a>
    </div>
</body>
</html>
